name: CI

# No branch filter: gitea.jamet.me tracks `master` while GitHub mirrors may use
# another default branch, and one file has to serve both.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # go.mod still says `go 1.12`, and that toolchain cannot parse the
          # runner's GOPROXY (`url|direct`). A newer toolchain builds a 1.12
          # module fine. The final dependency-bump hop switches back to
          # `go-version-file: go.mod`.
          go-version: '1.27.x'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # The repo has no test files, so this is only a compile check. iTerm2
      # (macOS) is needed to run the client, not to build it, and nothing
      # here exercises a live iTerm2.
      - name: Test
        run: go test -race ./...
