name: CI

# No branch filter: gitea.jamet.me tracks `master` while GitHub mirrors may use
# another default branch, and one file has to serve both.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # The repo has no test files, so this is only a compile check. iTerm2
      # (macOS) is needed to run the client, not to build it, and nothing
      # here exercises a live iTerm2.
      - name: Test
        run: go test -race ./...
